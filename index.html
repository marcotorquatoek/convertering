<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libbre ↔ Kg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#EDEFEA; --surface:#F8F9F6; --ink:#17262B; --muted:#5C6B70; --line:#CBD2CC; --accent:#2B6A88; --accent-ink:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#11191C; --surface:#192327; --ink:#E8EEEA; --muted:#93A3A8; --line:#2C3A3F; --accent:#6FB4D3; --accent-ink:#0C1518; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#11191C; --surface:#192327; --ink:#E8EEEA; --muted:#93A3A8; --line:#2C3A3F; --accent:#6FB4D3; --accent-ink:#0C1518; color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:28px 18px 40px}
main{width:100%;max-width:440px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
.field{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px 12px;transition:border-color .15s}
.field:focus-within{border-color:var(--accent)}
.field+.field{margin-top:10px}
label{display:block;color:var(--muted);font-size:.85rem;margin-bottom:2px}
.row{display:flex;align-items:baseline;gap:10px}
input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:2.4rem;font-weight:600;letter-spacing:-.02em;padding:2px 0;outline:none;font-variant-numeric:tabular-nums}
.unit{font-weight:800;font-size:1.3rem;color:var(--accent)}
.copy{border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.8rem;border-radius:999px;padding:5px 12px;cursor:pointer}
.copy:hover{border-color:var(--accent)}
.copy:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:1rem;font-weight:600;margin:28px 0 4px}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.95rem;border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;line-height:1.25}
.chip:hover{border-color:var(--accent)}
.chip small{display:block;color:var(--muted);font-size:.78rem}
.err{color:#B3392F;font-size:.85rem;min-height:1.2em;margin:8px 2px 0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#F08A80}}
:root[data-theme="dark"] .err{color:#F08A80}
</style>
</head>
<body>
<main>
  <h1>Libbre ↔ Kg</h1>
  <p class="sub">Scrivi in un campo, l’altro si aggiorna subito.</p>

  <div class="field">
    <label for="lb">Libbre</label>
    <div class="row">
      <input id="lb" inputmode="decimal" autocomplete="off" placeholder="0" aria-describedby="err">
      <span class="unit">lb</span>
      <button class="copy" data-for="lb" type="button">Copia</button>
    </div>
  </div>
  <div class="field">
    <label for="kg">Chilogrammi</label>
    <div class="row">
      <input id="kg" inputmode="decimal" autocomplete="off" placeholder="0" aria-describedby="err">
      <span class="unit">kg</span>
      <button class="copy" data-for="kg" type="button">Copia</button>
    </div>
  </div>
  <p class="err" id="err" role="alert"></p>

  <h2>Dischi e manubri in libbre</h2>
  <p class="hint">Tocca un valore per convertirlo.</p>
  <div class="chips" id="chips"></div>
</main>

<script>
(function(){
  var F = 0.45359237;
  var lb = document.getElementById('lb'), kg = document.getElementById('kg'), err = document.getElementById('err');

  function parse(s){
    s = String(s).trim().replace(/\s/g,'');
    if(!s) return null;
    // accetta sia virgola che punto come decimale
    if(s.indexOf(',')>-1 && s.indexOf('.')>-1){ s = s.replace(/\./g,'').replace(',','.'); }
    else { s = s.replace(',','.'); }
    if(!/^-?\d*\.?\d+$/.test(s)) return NaN;
    return parseFloat(s);
  }
  function fmt(n){
    var r = Math.round(n*100)/100;
    return String(r).replace('.',',');
  }
  function from(src){
    var v = parse(src.value);
    var dst = src===lb ? kg : lb;
    if(v===null){ dst.value=''; err.textContent=''; return; }
    if(isNaN(v)){ err.textContent='Inserisci solo numeri, ad esempio 12,5.'; dst.value=''; return; }
    err.textContent='';
    dst.value = fmt(src===lb ? v*F : v/F);
  }
  lb.addEventListener('input', function(){ from(lb); });
  kg.addEventListener('input', function(){ from(kg); });

  var plates = [2.5, 5, 10, 25, 35, 45, 55, 100];
  var chips = document.getElementById('chips');
  plates.forEach(function(p){
    var b = document.createElement('button');
    b.type='button'; b.className='chip';
    b.innerHTML = String(p).replace('.',',') + ' lb<small>' + fmt(p*F) + ' kg</small>';
    b.addEventListener('click', function(){ lb.value = String(p).replace('.',','); from(lb); });
    chips.appendChild(b);
  });

  document.querySelectorAll('.copy').forEach(function(btn){
    btn.addEventListener('click', function(){
      var el = document.getElementById(btn.getAttribute('data-for'));
      if(!el.value) return;
      var done = function(){ var t=btn.textContent; btn.textContent='Copiato'; setTimeout(function(){ btn.textContent=t; }, 1200); };
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(el.value).then(done, function(){}); }
        else { el.select(); document.execCommand('copy'); done(); }
      }catch(e){}
    });
  });
})();
</script>
</body>
</html>
